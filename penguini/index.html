<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit + user-scalable=no stops phones from zooming when you drag -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1624" />
    <meta name="description" content="PENGUINI - Cold City" />
    <title>PENGUINI</title>
    <style>
      /* Reset: the game canvas fills the whole screen, nothing scrolls. */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Stops pull-to-refresh firing mid-game, which cancels the pointer
           and leaves the stick stuck on. */
        overscroll-behavior: none;
        /* Deep navy night - the base colour of the whole game.
           Set here too so there's no white flash before Three.js starts. */
        background: #0a1624;
        color: #eaf4ff;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        /* Stops the browser trying to scroll/zoom when you drag on the canvas. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      canvas {
        display: block;
        /* Without this the browser claims the gesture as a scroll and simply
           stops sending us pointermove. */
        touch-action: none;
      }

      #input-layer {
        touch-action: none;
      }

      /* Shown while Three.js boots, then removed by main.js. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a1624;
        color: #3ff0c2;
        font-size: 12px;
        letter-spacing: 0.3em;
        transition: opacity 0.6s ease;
      }

      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }

      /* If the browser can't do 3D at all, say so in plain English. */
      #fatal {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
        line-height: 1.6;
        background: #0a1624;
      }
    </style>
  </head>
  <body>
    <div id="boot">LOADING COLD CITY</div>
    <div id="fatal">
      This game needs WebGL, which your browser has turned off or doesn't
      support. Try Chrome or Safari, or check your browser's graphics settings.
    </div>

    <!-- This one line loads the whole game. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
